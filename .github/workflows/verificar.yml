# Confere, a cada push, se as páginas publicadas correspondem aos dados em _fonte/dados
# e se os links internos apontam para arquivos e âncoras que existem.
name: Verificar o site

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r _fonte/requisitos.txt
      - run: python _fonte/construir.py --verificar
