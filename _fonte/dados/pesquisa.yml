declaracao:
  pt:
    - Minha pesquisa trata da formação social das classificações, isto é, de como normas, especialistas e instituições tornam uma diferença pertinente e em que relações essa diferença ganha consequência. No doutorado, acompanhei esse processo no comércio, na recomendação, no cultivo e na apreciação de flores e plantas ornamentais, do lote classificado na Veiling Holambra ao exemplar que se decide conservar.
    - Os trabalhos em andamento estendem a mesma pergunta a outros espaços. São eles as tomadas de posição de elites parlamentares latino-americanas sobre gênero, os usos desiguais da Internet no Brasil, a construção de equivalências na Taxonomia Sustentável Brasileira e, no projeto de pós-doutorado, as posições e trajetórias de quem produz a política ambiental federal. Nos estudos de espaços de posições e de práticas, construo esses espaços com Análise Geométrica de Dados; no estudo da Taxonomia, a análise é documental.
  en:
    - My research is about the social formation of classifications, that is, how standards, experts and institutions make a difference pertinent, and in which relations that difference has consequences. In my PhD I followed this process in the trade, recommendation, cultivation and appreciation of flowers and ornamental plants, from the lot graded at Veiling Holambra to the specimen someone decides to keep.
    - My work in progress extends the same question to other spaces. These are the position-takings of Latin American parliamentary elites on gender, unequal uses of the Internet in Brazil, the making of equivalences in the Brazilian Sustainable Taxonomy and, in my postdoctoral project, the positions and trajectories of those who make federal environmental policy. Where I study spaces of positions and practices, I construct them with Geometric Data Analysis; the study of the Taxonomy is documentary.

metodo:
  pt: Trabalho com a Análise Geométrica de Dados na formulação de Brigitte Le Roux e Henry Rouanet. Uso a ACM específica, com modalidades raras ou de não resposta tratadas como passivas, e as taxas modificadas. Leio os eixos pelas contribuições e as variáveis suplementares pelos desvios. Comparo subnuvens com a nuvem global pela análise de classe específica (CSA). A geometria constrói o objeto, e a interpretação se apoia nas contribuições, nos desvios e nas fontes documentais e qualitativas. Uso o SPAD e o R. Em novembro de 2025 participei do Geometric Data Analysis Workshop no IDHE.S (ENS Paris-Saclay), onde apresentei a pesquisa sobre plantas ornamentais.
  en: I work with Geometric Data Analysis as formulated by Brigitte Le Roux and Henry Rouanet. I use specific MCA, with rare or non-response categories treated as passive, and modified rates. I interpret axes through contributions and supplementary variables through deviations. I compare subclouds with the overall cloud through class specific analysis (CSA). The geometry constructs the object, and interpretation relies on contributions, deviations and documentary and qualitative sources. I use SPAD and R. In November 2025 I took part in the Geometric Data Analysis Workshop at IDHE.S (ENS Paris-Saclay), where I presented the research on ornamental plants.

tese:
  titulo:
    pt: "A vida social das flores: a classificação das coisas e a autoridade de quem julga"
    en: "The Social Life of Flowers: The Classification of Things and the Authority of Those Who Judge"
  sintese:
    pt: Classificações e julgamentos que atribuem valor a flores e plantas ornamentais, com normas comerciais, nomes e direitos, recomendações em plataformas digitais, repertórios de gosto e a festa da Expoflora.
    en: Classifications and judgments that confer value on flowers and ornamental plants, through commercial standards, names and rights, recommendations on digital platforms, repertoires of taste and the Expoflora festival.
  programa:
    pt: Programa de Pós-Graduação em Ciências Sociais, Faculdade de Ciências e Letras, UNESP (Araraquara)
    en: Graduate Programme in Social Sciences, School of Sciences and Letters, São Paulo State University (UNESP), Araraquara
  orientacao: Maria Aparecida Chaves Jardim
  estagio:
    pt: IDHE.S, ENS Paris-Saclay (2025–2026), com supervisão de Frédéric Lebaron (BEPE/FAPESP)
    en: IDHE.S, ENS Paris-Saclay (2025–2026), supervised by Frédéric Lebaron (FAPESP BEPE)
  defesa:
    pt: prevista para março de 2027
    en: scheduled for March 2027
  financiamento:
    pt: FAPESP, processos 2021/09533-8 (doutorado) e 2024/08337-9 (BEPE)
    en: FAPESP, grants 2021/09533-8 (PhD) and 2024/08337-9 (BEPE)
  versao_resumo:
    pt: Resumo da versão de outubro de 2026.
    en: Abstract as of October 2026.
  resumo:
    pt: Esta tese investiga como se estabelece o que conta numa planta, como as pessoas a conhecem e apreciam e em quais relações seus julgamentos orientam decisões. Em diálogo com Durkheim, Mauss e Bourdieu, reúne documentos históricos, normas comerciais brasileiras e neerlandesas, publicações digitais, questionário com 72 participantes, entrevistas e registros etnográficos da Expoflora. A leitura documental e das narrativas se articula à Análise Geométrica de Dados no exame de vocabulários e repertórios. Nas normas, uma categoria comercial admite diferenças entre as plantas do lote. Distinguir o que se examina, o que se mede e qual limite se aceita esclarece essa equivalência e as responsabilidades de seleção, informação e correção. Nos documentos históricos, nomes e composições participam da atribuição de crédito e de direitos profissionais. Nas plataformas, as recomendações relacionam propriedades vegetais a usos e destinatários; a análise lexical não sustentou as oposições gerais esperadas entre princípios de julgamento e posições profissionais. No questionário, apreciar um grupo convive com desconhecer alguns de seus exemplos. A familiaridade declarada participa das diferenças entre respostas, cuja interpretação muda com a lista e os denominadores. A comparação com filmes e música situa os repertórios entre os mesmos participantes; os testes não detectaram as associações familiares investigadas. Nos relatos de cultivo, procedência e cuidado dão razões para conservar exemplares semelhantes a outros. Na festa, a preparação de produtos, ambientes e fragmentos se relaciona a maneiras distintas de participar e guardar lembranças. Mostramos como o julgamento se liga às atribuições de selecionar, corrigir e oferecer, e por que conhecer, apreciar e decidir conservar exigem explicações distintas. A sociologia das classificações ganha precisão distinguindo o objeto e o alcance das intervenções.
    en: This thesis investigates how what counts in a plant is established, how people know and appreciate it, and in which relations their judgements guide decisions. In dialogue with Durkheim, Mauss and Bourdieu, it brings together historical documents, Brazilian and Dutch commercial standards, digital publications, a questionnaire with 72 participants, interviews and ethnographic records from Expoflora. Documentary and narrative analysis is combined with Geometric Data Analysis in the study of vocabularies and repertoires. In the standards, a commercial category allows differences among the plants in a lot. Distinguishing what is examined, what is measured and which limit is accepted clarifies this equivalence and the responsibilities for selection, reporting and correction. In historical documents, names and compositions participate in the allocation of credit and professional rights. On digital platforms, recommendations relate plant properties to uses and recipients; lexical analysis did not support the general oppositions expected between principles of judgement and professional positions. In the questionnaire, liking a group coexists with being unfamiliar with some of its examples. Declared familiarity contributes to differences among responses, whose interpretation changes with the list and the denominators. Comparison with films and music situates these repertoires among the same participants; the tests did not detect the family associations investigated. In accounts of cultivation, provenance and care provide reasons for keeping specimens similar to others. At the festival, the preparation of products, environments and fragments relates to different ways of participating and keeping mementos. We show how judgement relates to responsibilities for selecting, correcting and offering, and why knowing, appreciating and deciding to keep plants require distinct explanations. The sociology of classifications gains precision by examining objects and the scope of interventions.
  palavras_chave:
    pt: classificações sociais; plantas ornamentais; mercados; gosto; autoridade
    en: social classifications; ornamental plants; markets; taste; authority
