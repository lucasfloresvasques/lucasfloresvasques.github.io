# Página Ensino e materiais: docência, minicursos, materiais didáticos, dados e código.
# "arquivo" aponta para um arquivo do próprio site (por exemplo resources/...).

declaracao:
  pt: Ensino sociologia econômica, sociologia da cultura e métodos. Em cursos de métodos, gosto de partir da pergunta sociológica e da codificação das variáveis antes de chegar à ACM e à CSA.
  en: I teach economic sociology, the sociology of culture and methods. In methods courses I like to start from the sociological question and the coding of variables before turning to MCA and CSA.

