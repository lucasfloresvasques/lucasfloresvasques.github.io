lead:
  pt: Investigo como classificações, julgamentos e posições sociais participam da produção dos mercados, das políticas públicas e das práticas culturais.
  en: My research examines how social classifications, judgments, and positions shape markets, public policy, and cultural practices.

bio:
  pt:
    - No doutorado em Ciências Sociais na UNESP, orientado por Maria Aparecida Chaves Jardim, estudo as classificações e os julgamentos que atribuem valor a flores e plantas ornamentais, das normas comerciais da Veiling Holambra às escolhas de quem cultiva. A tese, *A vida social das flores*, tem defesa prevista para março de 2027.
    - Sou bolsista da FAPESP desde 2016, em cinco modalidades sucessivas, da iniciação científica ao doutorado e ao estágio de pesquisa no exterior. Em 2025–2026 fui pesquisador visitante no IDHE.S da ENS Paris-Saclay, com supervisão de Frédéric Lebaron. Trabalho com a Análise Geométrica de Dados na tradição de Brigitte Le Roux e Henry Rouanet.
    - Meu próximo projeto, uma proposta de pós-doutorado na UFSCar com supervisão de Silvio Eduardo Alvarez Candido, compara trajetórias e posições de quem produz a política ambiental federal no Executivo, no Congresso Nacional e no CONAMA, entre 2003 e 2026.
  en:
    - My PhD in Social Sciences at UNESP, supervised by Maria Aparecida Chaves Jardim, examines the classifications and judgments that confer value on flowers and ornamental plants, from the commercial standards of Veiling Holambra to the choices of those who grow them. The thesis, *The Social Life of Flowers*, will be defended in March 2027.
    - I have held FAPESP fellowships since 2016, in five successive schemes, from undergraduate research to the PhD and a research stay abroad. In 2025–2026 I was a visiting researcher at IDHE.S, ENS Paris-Saclay, supervised by Frédéric Lebaron. I work with Geometric Data Analysis in the tradition of Brigitte Le Roux and Henry Rouanet.
    - My next project, a postdoctoral proposal at the Federal University of São Carlos (UFSCar) supervised by Silvio Eduardo Alvarez Candido, compares the trajectories and positions of those who make federal environmental policy in the executive, Congress and the National Environment Council (CONAMA) between 2003 and 2026.

